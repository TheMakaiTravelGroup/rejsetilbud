.route2{list-style:none;margin:48px 0 0;padding:0;display:flex;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}

.r-leg .r-ico{position:relative;z-index:1;background:#A98953;box-shadow:0 0 0 8px #F4EFE5}

.r-num{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:#1F2E22;color:#F6F1E8;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;text-decoration:none}
.r-txt{display:flex;flex-direction:column;align-items:center;margin-top:12px}
