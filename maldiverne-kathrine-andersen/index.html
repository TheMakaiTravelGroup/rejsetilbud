</style></head><body><div class="ro" id="app"></div><script>window.MLDV_OFFER={"v":1,"lang":"da","generatedAt":"2026-11-16T19:19:17.718Z","customer":{"names":["Kathrine"],"nameRaw":"Kathrine Andersen","occasion":"","email":"kha6777@gmail.com","phone":"+4520993206","pax":{"line":"2 voksne · 1 teenager · 1 barn","adults":2,"teens":1,"kids":1,"infants":0},"letter":["Jeg glæder mig til at præsentere et skræddersyet rejseforslag til jer og håber, at det falder i smag.","Jeg har håndplukket mulighederne nedenfor, som giver absolut bedst kvalitet og værdi for pengene ud fra jeres ønsker. Hos Maldivia tror vi ikke på standardløsninger. Vi viser jer udelukkende steder vi selv kender, og som garanterer fantastisk hotelkvalitet i de smukkeste omgivelser, og garanterer alt fra beliggenhed i særklasse, nydelige værelser og villaer til personlig service og gastronomi, som er second to none.","De udvalgte hoteller og destinationer har hver deres unikke særpræg, men deler alle den samme høje standard. Da priser og tilgængelighed på de bedste flyrejser og resorts ændrer sig hurtigt, anbefaler jeg, at I ser mulighederne igennem snarest.","Jeg sidder klar på både telefon og e-mail, så snart I har fundet jeres favorit og er klar til at bestille rejsen."],"letterImage":"https://maldivia.dk/wp-content/uploads/2026/05/GL-HERO.jpg","sig":{"name":"Rasmus Kirketerp","role":"Co-Founder · Maldivia","_role0":"Co-Founder · Maldivia","email":"rk@maldivia.dk","phone":"+45 71 74 72 70","phoneRaw":"tel:+4571747270","photo":"https://maldivia.dk/wp-content/uploads/2026/05/RK-HERO-1.jpg"},"bookingEndpoint":"https://formspree.io/f/meewjdoz","tagline":"Personligt skræddersyet"},"trips":[{"idx":0,"type":"single","destination":"Maldiverne","hero":"https://maldivia.dk/wp-content/uploads/2025/09/Kandolhu-Maldives-download-7.jpeg","dateStart":"2027-03-17","dateEnd":"2027-03-29","nights":10,"currency":"DKK","priceWith":152000,"priceWithout":111000,"flightPart":41000,"includes":["Fly mellem Billund og Malé (T/R)","Transfer til/fra resortet","10 nætter på det valgte resort","Ophold i villatype som angivet","Forplejning (meal plan) som angivet","Alle obligatoriske skatter/afgifter"],"heroTitle":"Maldiverne / Det Indiske Ocean","notIncludes":[],"balanceDays":60,"images":{"resorts":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1792153417678-sirru-fen-fushi-luftfoto-lagune-palmer-hero.webp","included":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1792152652233-manta-ray-koralrev-shaviyani-atoll-hero.webp","price":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1791897350951-hvid-sandbanke-solopgang-como-cocoa-island-hero.webp","closing":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1791897818584-luftfoto-vandvilla-koralrev-como-cocoa-island-hero.webp"},"hotels":[{"id":"hotel-1794848419448-qwj8w","name":"Sun Siyam Iru Fushi","location":"Noonu Atoll","destination":"Maldiverne","stars":4,"starsPlus":true,"images":["https://maldivia.dk/wp-content/uploads/2025/10/SS-Iru-Fushi-3.jpg","https://maldivia.no/wp-content/uploads/sites/2/2026/01/SSIF-1.jpg","https://maldivia.dk/wp-content/uploads/2025/10/SS-Iru-Fushi-6.jpg","https://maldivia.dk/wp-content/uploads/2025/10/SS-Iru-Fushi-2.webp","https://maldivia.dk/wp-content/uploads/2025/10/SS-Iru-Fushi-5.jpg"],"hero":"https://maldivia.dk/wp-content/uploads/2025/10/SS-Iru-Fushi-3.jpg","web":"https://www.sunsiyam.com/sun-siyam-iru-fushi/","webLabel":"Udforsk Iru Fushi","transfer":"Vandfly · ca. 40 min.","size":"221 villaer","desc":"På Sun Siyam Iru Fushi i Noonu-atollen møder uspoleret ø-natur diskret luksus. Mærk kridhvidt sand mellem tæerne, nyd gastronomiske oplevelser på 15 restauranter og barer, og lad dig forkæle i en af Maldivernes største spaer. Et sanseligt paradis med en varm, autentisk maldivisk sjæl.","highlights":["Resortet udmærker sig ved et usædvanligt stort udvalg af spisesteder, der dækker alt fra fransk gourmet og italienske klassikere til levende teppanyaki, asiatisk fusionsmad og friske skaldyr på stranden.","Villaerne er indrettet i traditionel maldivisk stil med mørkt træ og stråtage, parret med moderne komfort. De er spredt langs stranden i den tætte vegetation eller placeret på pæle i lagunen, og mange har egen pool eller udendørs jacuzzi.","Husrevet ligger en kort svømmetur fra stranden og byder på et rigt marint liv med klovnefisk, rokker og harmløse revhajer. Øen har desuden sit eget Nemo Garden projekt for at beskytte og genopbygge korallerne.","Vandsportscentret er fuldt udstyret og tilbyder alt fra rolige ture i kajak og på paddleboard til mere actionprægede aktiviteter som windsurfing, jetski og uforglemmelige ture ud for at spotte delfiner eller fiske.","Det prisvindende spaområde er et af de største i regionen med 20 behandlingspavilloner, der er integreret i den tropiske have. Her tilbydes både ayurvediske massager og traditionelle østlige healingmetoder."],"cardText":"I Noonu-atollen møder traditionsrige villaer med stråtag 15 spisesteder og en prisvindende spa. Husrevet bugner af klovnefisk og rokker, vandsportscentret byder på kajak og delfinsafari.","quote":"Rigtig godt resort til en skarp pris, hvor både turkisblå laguner, husrev og masser af restauranter og aktiviteter venter - i hjertet af Noonu Atoll.","factsheetUrl":"https://maldivia.dk/wp-content/uploads/2025/10/Sun-Siyam-Iru-Fushi.pdf","mealPdfUrl":"https://maldivia.dk/wp-content/uploads/2026/10/sun-siyam-iru-fushi-premium-all-inclusive-dine-around-2026.pdf","mealDocs":[{"label":"","url":"https://maldivia.dk/wp-content/uploads/2026/10/sun-siyam-iru-fushi-premium-all-inclusive-dine-around-2026.pdf"}],"highlightsShort":["Beliggende i Noonu Atoll - knap 40 minutter med vandfly","Charmerende, maldiviske villaerm med privat pool","Fantastisk lagune og let tilgængeligt husrev ved øen","Større ø med mange restauranter og god All-Inclusive"],"dateStart":"2027-03-18","dateEnd":"2027-03-28","nights":10,"rooms":[{"room":"Deluxe Beach Villa with Pool","img":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1794848511578-poolvilla-straatag-sun-siyam-iru-fushi-maldiverne-hero.webp","link1":"https://www.sunsiyam.com/sun-siyam-iru-fushi/accommodation/deluxe-beach-villa-with-pool/","link1Label":"Se indkvartering →","link2":"https://maldivia.dk/wp-content/uploads/2026/10/sun-siyam-iru-fushi-premium-all-inclusive-dine-around-2026.pdf","link2Label":"Se forplejning →","meals":[{"idx":0,"meal":"Premium All-Inclusive — Dine Around","price":152000,"priceNoFly":0,"surcharge":0,"included":true}]}]},{"id":"hotel-1794850723193-548up","name":"JA Manafaru","location":"Haa Alifu Atoll","destination":"Maldiverne","stars":5,"starsPlus":false,"images":["https://maldivia.dk/wp-content/uploads/2023/01/JA-Manafaru-Arial-Shot.1-min.jpg","https://maldivia.dk/wp-content/uploads/2026/06/JAM-1-scaled.webp","https://maldivia.dk/wp-content/uploads/2026/06/IMG_3042-scaled.jpg","https://maldivia.dk/wp-content/uploads/2026/06/JAM-6-scaled.jpg","https://maldivia.dk/wp-content/uploads/2026/06/JAM-3.jpg"],"hero":"https://maldivia.dk/wp-content/uploads/2023/01/JA-Manafaru-Arial-Shot.1-min.jpg","web":"https://www.jaresortshotels.com/maldives/ja-manafaru","webLabel":"Udforsk JA Manafaru","transfer":"Vandfly · ca. 70 min.","size":"84 villaer","desc":"JA Manafaru er et prisvindende og skjult luksusparadis helt oppe i det nordligste Maldiverne, hvor du oplever en sjælden følelse af eksklusivitet og det ægte Maldiverne. Jeg elsker dette resort, fordi du her får en naturlig maldivisk ø, spækket med frodig natur og svajende palmer.  Strandene er brede og kridhvide, servicen i absolut verdensklasse - og det kulinariske niveau helt oppe i superligaen.","highlights":["Alle de fritstående villaer og suiter er ekstremt rummelige, ligger privat og har sin egen private pool. Vi elsker især resortets villaer over havet og ved revet.","Resortet har en af Maldivernes mest unikke vinkældre, The Cellar, som ligger to meter under havets overflade. Her kan du opleve eksklusive vinsmagninger og private middage i en helt speciel atmosfære.","Det kulinariske niveau er tårnhøjt med mange forskellige restauranter og barer, hvor du kan nyde alt fra traditionelle maldiviske smage på Kakuni til asiatisk-inspireret skaldyr og fisk på restauranten Ocean Grill.","Husrevet er let tilgængeligt fra især resortets Water Villas, og vrimler med liv takket være øens nordlige beliggenhed, som tiltrækker store mængder af farverige fisk, havskildpadder og harmløse revhajer.","Det prisvindende Calm Spa Sanctuary ligger gemt inde i den tætte jungle og tilbyder holistiske ayurvediske behandlinger i smukke, private udendørspavilioner præget af beroligende bassiner."],"cardText":"JA Manafaru er et prisvindende og skjult luksusparadis helt oppe i det nordligste Maldiverne, hvor du oplever en sjælden følelse af eksklusivitet og det ægte Maldiverne.","quote":"JA Manafaru er et idyllisk resort i den aller nordligste del af Maldiverne, som især imponerer med forrygende gastronomi, skøn service og poolvillaer.","factsheetUrl":"https://maldivia.dk/wp-content/uploads/2026/11/JAM-FS.pdf","mealPdfUrl":"https://maldivia.dk/wp-content/uploads/2026/08/JM-AI.pdf","mealDocs":[{"label":"","url":"https://maldivia.dk/wp-content/uploads/2026/08/JM-AI.pdf"}],"highlightsShort":["Alle de fritstående villaer på resortet har privat pool","Resortet er især kendt for sin fantastiske gastronomi","En stor lagune og et fint husrev venter på jer","Udforsk øen på cykel eller spil et slag tennis i junglen"],"dateStart":"2027-03-18","dateEnd":"2027-03-28","nights":10,"rooms":[{"room":"Sunrise Water Villa With Infinity Pool","img":"https://ghpnayymhfvbednwiuns.supabase.co/storage/v1/object/public/site-images/image/1794851886749-terrasse-solnedgang-pool-ja-manaforu-maldiverne-hero.webp","link1":"","link1Label":"Se indkvartering →","link2":"","link2Label":"Læs mere om hotellet →","meals":[{"idx":0,"meal":"Halvpension — Dine Around","price":178500,"priceNoFly":0,"surcharge":26500,"included":false}]}]},{"id":"hotel-1794850727393-qhnqt","name":"SO/ Maldives","location":"South Malé Atoll","destination":"Maldiverne","stars":5,"starsPlus":false,"images":["https://maldivia.dk/wp-content/uploads/2026/09/SM-5-scaled.jpg","https://maldivia.dk/wp-content/uploads/2026/09/SM-1.webp","https://maldivia.dk/wp-content/uploads/2026/09/SM-3.webp","https://maldivia.dk/wp-content/uploads/2026/09/SM-2.webp","https://maldivia.dk/wp-content/uploads/2026/09/SM-4.jpg"],"hero":"https://maldivia.dk/wp-content/uploads/2026/09/SM-5-scaled.jpg","web":"https://so-hotels.com/en/maldives/","webLabel":"","transfer":"Speedbåd · ca. 20 min.","size":"80 villaer","desc":"SO/ Maldives er et fashion-forward luksusresort på sin egen private ø i den idylliske Emboodhoo-lagune – blot 15 minutters speedbådstur fra Malé. Her er traditionel ø-æstetik skiftet ud med dristig arkitektur, haute couture-detaljer og en sofistikeret, legende atmosfære. Resortets 80 eksklusive strand- og vandvillaer er skabt som private fristeder med egen pool, panoramavinduer og direkte adgang til det krystalklare hav.","highlights":["Indkvarteringen består af 80 strand- og vandvillaer fordelt på en til tre etager. Villaerne har et moderne og karakterfuldt udtryk med rene linjer, specialdesignede møbler og store glaspartier, der lukker masser af lys ind. Alle villaer har egen pool, rummelige udendørsområder og enten direkte adgang til stranden eller lagunen.","Resortet har tre forskellige restauranter og barer. The Hadaba serverer retter med inspiration fra det levantinske køkken, herunder grillede specialiteter og langsomt tilberedt kød. Ved poolen ligger Lazuli Beach Club, som kombinerer middelhavsinspirerede retter med musik og en livlig stemning, særligt omkring solnedgang. Citronelle Club byder på asiatiske retter med fokus på friske råvarer og lette, moderne smagskombinationer.","The Wellness Camp er resortets moderne wellnessområde og tilbyder blandt andet sauna, dampbad, hammam og træningsfaciliteter. Behandlingsmenuen omfatter forskellige massage-, krops- og ansigtsbehandlinger i rolige omgivelser.","Resortet har et bredt udvalg af aktiviteter på og omkring vandet. Vandsportscentret tilbyder blandt andet e-foil, jetboard, kajak og standup-paddleboarding. Der er desuden mulighed for snorkling og dykning i området omkring Emboodhoo Lagoon, hvor man kan opleve havskildpadder, rokker og et varieret marineliv.","Det særlige ved SO/ Maldives er kombinationen af moderne design, livlig atmosfære og den korte afstand til Malé. Resortet skiller sig ud med sit visuelle udtryk, sin strandklub og sit fokus på mode, musik og moderne livsstil."],"cardText":"Kun 20 minutter fra Malé møder avantgarde-design den turkisblå Emboodhoo-lagune. På SO/ Maldives venter private poolvillaer, høj gastronomi og ubesværet ø-luksus med kant.","quote":"SO Maldives byder på fremragende, hipt design, en vidunderlig turkisblå lagune, farverige omgivelser og lækre, moderne poolvillaer.","factsheetUrl":"https://maldivia.dk/wp-content/uploads/2026/09/SOM-FS.pdf","mealPdfUrl":"","mealDocs":[],"highlightsShort":["Skræddersyet avantgarde-design i en stor turkisblå lagune","Kun 20 minutters speedbådstur fra Malé lufthavn","Eksklusive strand- og vandvillaer med egen pool","Chik beach club-stemning og gastronomi i særklasse"],"dateStart":"2027-03-18","dateEnd":"2027-03-28","nights":10,"rooms":[{"room":"Family Beach Pool Villa Capsule","img":"","link1":"https://so-hotels.com/en/maldives/villa-collections/beach-villas/capsule/","link1Label":"Se indkvartering →","link2":"https://so-hotels.com/en/maldives/","link2Label":"Læs mere om hotellet →","meals":[{"idx":0,"meal":"Halvpension","price":180000,"priceNoFly":0,"surcharge":28000,"included":false},{"idx":1,"meal":"Helpension","price":199000,"priceNoFly":0,"surcharge":47000,"included":false}]}]},{"id":"hotel-1794850582839-u8098","name":"Ayada Maldives","loc
